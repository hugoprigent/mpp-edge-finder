services:
  mpp-edge-finder:
    build: .
    container_name: mpp-edge-finder
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8787:8787"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
